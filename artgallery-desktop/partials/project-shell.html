<!-- ArtGallery Project Shell - Shared Patterns Reference -->
<!-- This file documents shared layout patterns for all terminals -->
<!-- Brand CSS: colors_and_type.css with prefix "ag" -->
<!-- Primary: #1A365D | Success: #2E7D32 | Warning: #F57C00 | Error: #E53935 | Forced Takedown: #8B0000 -->
<!--
  Terminal Layouts:
  1. Admin Backend: Left sidebar (240px, #1A365D bg) + Right content (white bg)
  2. Artist Workstation: Left sidebar (240px, #1A365D bg) + Right content (white bg)
  3. Buyer Website: Top nav bar + Center content + Footer

  Shared Elements:
  - Status tags: .tag-pending (orange), .tag-approved (green), .tag-rejected (red), .tag-offline (grey), .tag-forced-offline (dark red)
  - Buttons: .btn-primary (filled), .btn-secondary (outline), .btn-disabled (grey), .btn-danger (red)
  - Cards: 8px radius, border-led (no shadow for static)
  - Images: 8px radius
  - Modals: shadow-modal, 12px radius, centered with backdrop
  - Font: PingFang SC / Microsoft YaHei / Noto Sans SC
-->
