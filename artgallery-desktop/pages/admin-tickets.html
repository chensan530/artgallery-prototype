/* ==========================================================================
   ArtGallery Brand CSS — Deep Blue-Grey Art Platform
   Primary: #1A365D | States: Success #2E7D32, Warning #F57C00, Error #E53935
   ========================================================================== */

:root {
  /* --- Brand Primary Scale (#1A365D base) --- */
  --ag-primary-50: #F0F5FA;
  --ag-primary-100: #DCE7F2;
  --ag-primary-200: #B8CFE5;
  --ag-primary-300: #8FB0D2;
  --ag-primary-400: #5E87B5;
  --ag-primary-500: #3A6A9A;
  --ag-primary-600: #2A5279;
  --ag-primary-700: #1A365D;  /* === MAIN BRAND COLOR === */
  --ag-primary-800: #152B4A;
  --ag-primary-900: #102136;

  /* --- Neutral Scale (blue-grey) --- */
  --ag-neutral-50: #F8FAFC;
  --ag-neutral-100: #F1F5F9;
  --ag-neutral-200: #E2E8F0;
  --ag-neutral-300: #CBD5E1;
  --ag-neutral-400: #94A3B8;
  --ag-neutral-500: #64748B;
  --ag-neutral-600: #475569;
  --ag-neutral-700: #334155;
  --ag-neutral-800: #1E293B;
  --ag-neutral-900: #0F172A;

  /* --- State Colors (semantic status only) --- */
  --state-success: #2E7D32;
  --state-success-light: #E8F5E9;
  --state-success-dark: #1B5E20;
  --state-warning: #F57C00;
  --state-warning-light: #FFF3E0;
  --state-warning-dark: #E65100;
  --state-error: #E53935;
  --state-error-light: #FFEBEE;
  --state-error-dark: #C62828;
  --state-info: #1976D2;
  --state-info-light: #E3F2FD;

  /* --- Force Takedown (special dark-red) --- */
  --state-forced-takedown: #8B0000;
  --state-forced-takedown-light: #FCE4EC;

  /* --- Semantic Aliases (light mode) --- */
  --ag-background: #FFFFFF;
  --ag-foreground: #1E293B;
  --ag-card: #FFFFFF;
  --ag-card-foreground: #1E293B;
  --ag-popover: #FFFFFF;
  --ag-popover-foreground: #1E293B;
  --ag-primary: #1A365D;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #F1F5F9;
  --ag-muted-foreground: #64748B;
  --ag-border: #E2E8F0;
  --ag-input: #E2E8F0;
  --ag-ring: #1A365D;

  /* --- Radius --- */
  --ag-radius-small: 4px;
  --ag-radius-medium: 8px;
  --ag-radius-large: 12px;
  --ag-radius-full: 9999px;

  /* --- Typography --- */
  --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ag-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* --- Font Sizes --- */
  --ag-text-xs: 12px;
  --ag-text-sm: 13px;
  --ag-text-base: 14px;
  --ag-text-md: 15px;
  --ag-text-lg: 16px;
  --ag-text-xl: 18px;
  --ag-text-2xl: 20px;
  --ag-text-3xl: 24px;
  --ag-text-4xl: 28px;
  --ag-text-5xl: 32px;

  /* --- Shadows (floating layers only: modal, popover, dropdown) --- */
  --ag-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --ag-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --ag-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --ag-shadow-modal: 0 12px 40px rgba(0,0,0,0.16);
}

/* --- Dark Mode (optional, for admin dark panels) --- */
.dark {
  --ag-background: #0F172A;
  --ag-foreground: #E2E8F0;
  --ag-card: #1E293B;
  --ag-card-foreground: #E2E8F0;
  --ag-popover: #1E293B;
  --ag-popover-foreground: #E2E8F0;
  --ag-primary: #5E87B5;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #334155;
  --ag-muted-foreground: #94A3B8;
  --ag-border: #334155;
  --ag-input: #334155;
  --ag-ring: #5E87B5;
}

/* --- Base Typography --- */
body {
  font-family: var(--ag-font-sans);
  font-size: var(--ag-text-base);
  color: var(--ag-foreground);
  background: var(--ag-background);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Status Tag Utility Classes --- */
.tag-pending {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-warning-light);
  color: var(--state-warning-dark);
  white-space: nowrap;
}

.tag-approved {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-success-light);
  color: var(--state-success-dark);
  white-space: nowrap;
}

.tag-rejected {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-error-light);
  color: var(--state-error-dark);
  white-space: nowrap;
}

.tag-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-600);
  white-space: nowrap;
}

.tag-forced-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-forced-takedown-light);
  color: var(--state-forced-takedown);
  white-space: nowrap;
}

/* --- Button Utilities --- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-primary);
  color: var(--ag-primary-foreground);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: var(--ag-primary-600);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: #FFFFFF;
  color: var(--ag-primary);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover {
  background: var(--ag-primary-50);
}

.btn-disabled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-400);
  border: 1px solid var(--ag-neutral-200);
  cursor: not-allowed;
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: var(--state-error-dark);
}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var notifyBtn = document.getElementById('btn-notify');
    if (notifyBtn) notifyBtn.addEventListener('click', function () { alert('您有 3 条未读通知'); });

    // ===== Tab 切换 =====
    var tabs = document.querySelectorAll('#ticket-tabs .tab-btn');
    var panels = { online: 'panel-online' };
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function (t) { t.classList.remove('active'); });
        this.classList.add('active');
        var key = this.id.replace('tab-', '');
        Object.keys(panels).forEach(function (k) {
          document.getElementById(panels[k]).style.display = (k === key) ? 'block' : 'none';
        });
        if (key === 'online') { renderConversations(); renderMessages(); updateChatHeader(); }
      });
    });

    // ===== 在线对话 =====
    var CONV_KEY = 'ag_chat_conversations';
    var BUYER_NAMES = { 'buyer-demo-1': '张雅文', 'buyer-demo-2': 'Sarah Johnson' };
    var currentConvId = null;
    var msgLen = {};
    var unread = {};

    function nowTime() {
      var d = new Date();
      function pad(n) { return n < 10 ? '0' + n : '' + n; }
      return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function loadConversations() {
      var raw = localStorage.getItem(CONV_KEY);
      var data = null;
      if (raw) { try { data = JSON.parse(raw); } catch (e) { data = null; } }
      if (!data || Object.keys(data).length === 0) {
        data = {
          'buyer-demo-1': [
            { role: 'agent', text: '您好，欢迎来到 ArtGallery！我是平台客服小艺，请问有什么可以帮您？', time: '08-10 09:00' }
          ],
          'buyer-demo-2': [
            { role: 'buyer', text: 'Hello, I have a question about shipping to the UK.', time: '08-09 14:20' },
            { role: 'agent', text: 'Hello Sarah! We ship worldwide via DHL/SF, usually 5-7 business days.', time: '08-09 14:21' }
          ]
        };
        localStorage.setItem(CONV_KEY, JSON.stringify(data));
      }
      return data;
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderConversations() {
      var data = loadConversations();
      var list = document.getElementById('conv-list');
      var keys = Object.keys(data);
      list.innerHTML = '';
      if (keys.length === 0) {
        list.innerHTML = '<div class="conv-empty">暂无会话</div>';
        return;
      }
      keys.forEach(function (id) {
        var msgs = data[id] || [];
        var last = msgs[msgs.length - 1];
        var preview = last ? last.text : '';
        if (preview.length > 18) { preview = preview.slice(0, 18) + '…'; }
        var time = last ? last.time : '';
        var name = BUYER_NAMES[id] || id;
        var isOnline = (id === 'buyer-demo-1');
        var unreadCount = unread[id] || 0;
        var item = document.createElement('div');
        item.className = 'conv-item' + (id === currentConvId ? ' active' : '');
        item.dataset.conv = id;
        item.innerHTML =
          '<img class="conv-avatar" src="../assets/art-portrait.jpg" alt="买家头像">' +
          '<div class="conv-main">' +
            '<div class="conv-top">' +
              '<span class="conv-name">' + escapeHtml(name) + '</span>' +
              '<span class="conv-time">' + escapeHtml(time) + '</span>' +
            '</div>' +
            '<div class="conv-status">' +
              '<span class="status-dot ' + (isOnline ? 'online' : 'offline') + '"></span>' +
              '<span class="status-text">' + (isOnline ? '在线' : '离线') + '</span>' +
            '</div>' +
            '<div class="conv-bottom">' +
              '<span class="conv-preview">' + escapeHtml(preview) + '</span>' +
              (unreadCount > 0 ? '<span class="unread-dot" title="未读"></span>' : '') +
            '</div>' +
          '</div>';
        item.addEventListener('click', function () {
          currentConvId = id;
          unread[id] = 0;
          renderConversations();
          renderMessages();
          updateChatHeader();
        });
        list.appendChild(item);
        msgLen[id] = msgs.length;
      });
    }

    function renderMessages() {
      var box = document.getElementById('chat-messages');
      if (!box) { return; }
      var data = loadConversations();
      if (!currentConvId) {
        box.innerHTML = '<div class="chat-empty">请选择左侧会话开始回复</div>';
        return;
      }
      var msgs = data[currentConvId] || [];
      box.innerHTML = '';
      msgs.forEach(function (m) {
        var isBuyer = (m.role === 'buyer');
        var row = document.createElement('div');
        row.className = 'msg-row ' + (isBuyer ? 'buyer' : 'agent');
        row.innerHTML = '<div class="msg-bubble ' + (isBuyer ? 'msg-buyer' : 'msg-agent') + '">' +
          '<div class="msg-text">' + escapeHtml(m.text) + '</div>' +
          '<div class="msg-time">' + escapeHtml(m.time) + '</div>' +
        '</div>';
        box.appendChild(row);
      });
      msgLen[currentConvId] = msgs.length;
      box.scrollTop = box.scrollHeight;
    }

    function updateChatHeader() {
      var titleEl = document.getElementById('chat-header-name');
      var statusEl = document.getElementById('chat-header-status');
      if (!titleEl || !statusEl) { return; }
      if (!currentConvId) {
        titleEl.textContent = '请选择会话';
        statusEl.innerHTML = '';
        return;
      }
      var name = BUYER_NAMES[currentConvId] || currentConvId;
      var isOnline = (currentConvId === 'buyer-demo-1');
      titleEl.textContent = name;
      statusEl.innerHTML = '<span class="status-dot ' + (isOnline ? 'online' : 'offline') + '"></span><span class="status-text">' + (isOnline ? '在线' : '离线') + '</span>';
    }

    function sendReply() {
      var input = document.getElementById('chat-input');
      if (!input) { return; }
      var text = input.value.trim();
      if (!text || !currentConvId) { return; }
      var data = loadConversations();
      if (!data[currentConvId]) { data[currentConvId] = []; }
      data[currentConvId].push({ role: 'agent', text: text, time: nowTime() });
      localStorage.setItem(CONV_KEY, JSON.stringify(data));
      input.value = '';
      renderConversations();
      renderMessages();
    }

    var sendBtn = document.getElementById('btn-send');
    if (sendBtn) { sendBtn.addEventListener('click', sendReply); }
    var chatInput = document.getElementById('chat-input');
    if (chatInput) {
      chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
      });
    }

    // storage 事件：买家端在其他标签页发消息时即时刷新（跨标签页实时对话演示）
    window.addEventListener('storage', function (e) {
      if (e.key !== CONV_KEY) { return; }
      var data = loadConversations();
      var keys = Object.keys(data);
      keys.forEach(function (id) {
        var len = (data[id] || []).length;
        var prev = msgLen[id];
        if (prev === undefined || (typeof prev === 'number' && len > prev)) {
          var last = data[id][len - 1];
          if (id === currentConvId) {
            renderMessages();
          } else if (last && last.role === 'buyer') {
            unread[id] = (unread[id] || 0) + 1;
          }
        }
      });
      renderConversations();
    });

    // 初始渲染
    renderConversations();
    var firstKeys = Object.keys(loadConversations());
    if (firstKeys.length > 0 && !currentConvId) { currentConvId = firstKeys[0]; }
    renderConversations();
    renderMessages();
    updateChatHeader();
  });
</script>
