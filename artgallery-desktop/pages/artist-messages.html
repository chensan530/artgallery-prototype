    <style id="theme-vars">
/* ==========================================================================
   ArtGallery Brand CSS — Deep Blue-Grey Art Platform
   Primary: #1A365D | States: Success #2E7D32, Warning #F57C00, Error #E53935
   ========================================================================== */

:root {
  /* --- Brand Primary Scale (#1A365D base) --- */
  --ag-primary-50: #F0F5FA;
  --ag-primary-100: #DCE7F2;
  --ag-primary-200: #B8CFE5;
  --ag-primary-300: #8FB0D2;
  --ag-primary-400: #5E87B5;
  --ag-primary-500: #3A6A9A;
  --ag-primary-600: #2A5279;
  --ag-primary-700: #1A365D;  /* === MAIN BRAND COLOR === */
  --ag-primary-800: #152B4A;
  --ag-primary-900: #102136;

  /* --- Neutral Scale (blue-grey) --- */
  --ag-neutral-50: #F8FAFC;
  --ag-neutral-100: #F1F5F9;
  --ag-neutral-200: #E2E8F0;
  --ag-neutral-300: #CBD5E1;
  --ag-neutral-400: #94A3B8;
  --ag-neutral-500: #64748B;
  --ag-neutral-600: #475569;
  --ag-neutral-700: #334155;
  --ag-neutral-800: #1E293B;
  --ag-neutral-900: #0F172A;

  /* --- State Colors (semantic status only) --- */
  --state-success: #2E7D32;
  --state-success-light: #E8F5E9;
  --state-success-dark: #1B5E20;
  --state-warning: #F57C00;
  --state-warning-light: #FFF3E0;
  --state-warning-dark: #E65100;
  --state-error: #E53935;
  --state-error-light: #FFEBEE;
  --state-error-dark: #C62828;
  --state-info: #1976D2;
  --state-info-light: #E3F2FD;

  /* --- Force Takedown (special dark-red) --- */
  --state-forced-takedown: #8B0000;
  --state-forced-takedown-light: #FCE4EC;

  /* --- Semantic Aliases (light mode) --- */
  --ag-background: #FFFFFF;
  --ag-foreground: #1E293B;
  --ag-card: #FFFFFF;
  --ag-card-foreground: #1E293B;
  --ag-popover: #FFFFFF;
  --ag-popover-foreground: #1E293B;
  --ag-primary: #1A365D;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #F1F5F9;
  --ag-muted-foreground: #64748B;
  --ag-border: #E2E8F0;
  --ag-input: #E2E8F0;
  --ag-ring: #1A365D;

  /* --- Radius --- */
  --ag-radius-small: 4px;
  --ag-radius-medium: 8px;
  --ag-radius-large: 12px;
  --ag-radius-full: 9999px;

  /* --- Typography --- */
  --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ag-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* --- Font Sizes --- */
  --ag-text-xs: 12px;
  --ag-text-sm: 13px;
  --ag-text-base: 14px;
  --ag-text-md: 15px;
  --ag-text-lg: 16px;
  --ag-text-xl: 18px;
  --ag-text-2xl: 20px;
  --ag-text-3xl: 24px;
  --ag-text-4xl: 28px;
  --ag-text-5xl: 32px;

  /* --- Shadows (floating layers only: modal, popover, dropdown) --- */
  --ag-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --ag-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --ag-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --ag-shadow-modal: 0 12px 40px rgba(0,0,0,0.16);
}

/* --- Dark Mode (optional, for admin dark panels) --- */
.dark {
  --ag-background: #0F172A;
  --ag-foreground: #E2E8F0;
  --ag-card: #1E293B;
  --ag-card-foreground: #E2E8F0;
  --ag-popover: #1E293B;
  --ag-popover-foreground: #E2E8F0;
  --ag-primary: #5E87B5;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #334155;
  --ag-muted-foreground: #94A3B8;
  --ag-border: #334155;
  --ag-input: #334155;
  --ag-ring: #5E87B5;
}

/* --- Base Typography --- */
body {
  font-family: var(--ag-font-sans);
  font-size: var(--ag-text-base);
  color: var(--ag-foreground);
  background: var(--ag-background);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Status Tag Utility Classes --- */
.tag-pending {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-warning-light);
  color: var(--state-warning-dark);
  white-space: nowrap;
}

.tag-approved {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-success-light);
  color: var(--state-success-dark);
  white-space: nowrap;
}

.tag-rejected {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-error-light);
  color: var(--state-error-dark);
  white-space: nowrap;
}

.tag-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-600);
  white-space: nowrap;
}

.tag-forced-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-forced-takedown-light);
  color: var(--state-forced-takedown);
  white-space: nowrap;
}

/* --- Button Utilities --- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-primary);
  color: var(--ag-primary-foreground);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: var(--ag-primary-600);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: #FFFFFF;
  color: var(--ag-primary);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover {
  background: var(--ag-primary-50);
}

.btn-disabled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-400);
  border: 1px solid var(--ag-neutral-200);
  cursor: not-allowed;
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: var(--state-error-dark);
}

    </style>

<body class="ag-app-body">
  <style id="critical-layout">
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    .ag-app-body {
      height: 100vh;
      overflow: hidden;
      background: var(--ag-neutral-50);
      color: var(--ag-foreground);
      font-family: var(--ag-font-sans);
      font-size: var(--ag-text-base);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== App Shell ===== */
    .app-shell { display: flex; height: 100vh; overflow: hidden; min-height: 0; }
    .sidebar { width: 240px; flex-shrink: 0; background: var(--ag-primary); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
    .sidebar-logo { height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 24px; font-size: var(--ag-text-xl); font-weight: 600; color: #fff; letter-spacing: 0.01em; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .sidebar-logo .logo-mark { width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
    .sidebar-nav { padding: 12px 0; flex: 1; min-height: 0; }
    .nav-section-label { padding: 14px 24px 6px; font-size: var(--ag-text-xs); color: rgba(255,255,255,0.4); letter-spacing: 0.04em; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 24px; color: rgba(255,255,255,0.72); font-size: var(--ag-text-md); cursor: pointer; transition: background 0.15s, color 0.15s; border-left: 3px solid transparent; text-decoration: none; white-space: nowrap; }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .nav-item:focus-visible { outline: 2px solid rgba(255,255,255,0.6); outline-offset: -2px; }
    .nav-item.active { background: rgba(255,255,255,0.10); color: #fff; border-left-color: #fff; font-weight: 500; }
    .nav-item svg { flex-shrink: 0; }
    .nav-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-foot { flex-shrink: 0; padding: 14px 24px; border-top: 1px solid rgba(255,255,255,0.08); font-size: var(--ag-text-xs); color: rgba(255,255,255,0.45); }

    /* ===== Main Area ===== */
    .main-area { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .topbar { height: 64px; flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--ag-border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 16px; }
    .topbar-left { display: flex; flex-direction: column; min-width: 0; }
    .topbar-title { font-size: var(--ag-text-xl); font-weight: 600; color: var(--ag-foreground); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-sub { font-size: var(--ag-text-xs); color: var(--ag-muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .artist-chip { display: flex; align-items: center; gap: 10px; }
    .artist-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--ag-primary-100); color: var(--ag-primary); display: flex; align-items: center; justify-content: center; font-size: var(--ag-text-sm); font-weight: 600; flex-shrink: 0; }
    .artist-info { display: flex; flex-direction: column; line-height: 1.3; }
    .artist-name { font-size: var(--ag-text-md); color: var(--ag-foreground); font-weight: 500; }
    .status-badge { align-self: flex-start; font-size: 11px; padding: 1px 8px; border-radius: var(--ag-radius-small); background: var(--state-success-light); color: var(--state-success-dark); font-weight: 500; white-space: nowrap; line-height: 1.5; }

    /* ===== Content Scroll ===== */
    .content-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }

    /* ===== Page Title ===== */
    .page-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .page-title { font-size: var(--ag-text-3xl); font-weight: 600; color: var(--ag-foreground); margin: 0; line-height: 1.3; }
    .page-desc { font-size: var(--ag-text-sm); color: var(--ag-muted-foreground); margin: 4px 0 0; }

    /* ===== Cards ===== */
    .card { background: #fff; border: 1px solid var(--ag-border); border-radius: var(--ag-radius-large); padding: 24px 28px; min-width: 0; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--ag-border); }
    .card-title { font-size: var(--ag-text-xl); font-weight: 600; color: var(--ag-foreground); margin: 0; line-height: 1.3; }
    .card-sub { font-size: var(--ag-text-sm); color: var(--ag-muted-foreground); margin: 4px 0 0; line-height: 1.5; }

    /* ===== Button micro-interactions ===== */
    .btn-primary:active, .btn-secondary:active, .btn-danger:active { transform: translateY(1px); }

    /* ===== Chat Workbench (买家沟通) ===== */
    .chat-workbench { display: flex; gap: 16px; height: calc(100vh - 240px); min-height: 460px; }
    .conv-list { width: 260px; flex-shrink: 0; background: #fff; border: 1px solid var(--ag-border); border-radius: var(--ag-radius-medium); display: flex; flex-direction: column; overflow: hidden; }
    .conv-list-header { flex-shrink: 0; padding: 14px 16px; border-bottom: 1px solid var(--ag-border); font-size: var(--ag-text-md); font-weight: 600; color: var(--ag-foreground); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .conv-list-count { font-size: var(--ag-text-xs); font-weight: 500; color: var(--ag-muted-foreground); }
    .conv-items { flex: 1; min-height: 0; overflow-y: auto; }
    .conv-item { display: flex; gap: 10px; padding: 12px 14px; cursor: pointer; border-left: 3px solid transparent; border-bottom: 1px solid var(--ag-neutral-100); transition: background 0.15s, border-color 0.15s; }
    .conv-item:hover { background: var(--ag-primary-50); }
    .conv-item.active { background: var(--ag-primary-50); border-left-color: var(--ag-primary); }
    .conv-item:focus-visible { outline: 2px solid var(--ag-ring); outline-offset: -2px; }
    .conv-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--ag-primary-100); }
    .conv-main { flex: 1; min-width: 0; }
    .conv-name-row { display: flex; align-items: center; gap: 6px; }
    .conv-buyer { font-size: var(--ag-text-md); font-weight: 500; color: var(--ag-foreground); }
    .conv-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .conv-status.online { background: var(--state-success); }
    .conv-status.offline { background: var(--ag-neutral-300); }
    .conv-summary { font-size: var(--ag-text-xs); color: var(--ag-muted-foreground); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .conv-time { font-size: 11px; color: var(--ag-muted-foreground); white-space: nowrap; }
    .conv-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--state-error); display: none; }
    .conv-item.has-unread .conv-dot { display: block; }
    .conv-note { flex-shrink: 0; padding: 10px 14px; border-top: 1px solid var(--ag-border); font-size: var(--ag-text-xs); color: var(--ag-muted-foreground); line-height: 1.6; background: var(--ag-neutral-50); }

    .chat-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--ag-border); border-radius: var(--ag-radius-medium); background: var(--ag-card); overflow: hidden; }
    .chat-header { flex-shrink: 0; padding: 14px 18px; border-bottom: 1px solid var(--ag-border); display: flex; align-items: center; gap: 12px; }
    .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--ag-primary-100); }
    .chat-header-main { min-width: 0; }
    .chat-header-title { font-size: var(--ag-text-lg); font-weight: 600; color: var(--ag-foreground); line-height: 1.3; }
    .chat-header-sub { font-size: var(--ag-text-xs); color: var(--ag-muted-foreground); margin-top: 2px; }
    .chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--ag-neutral-50); }
    .chat-empty { margin: auto; color: var(--ag-muted-foreground); font-size: var(--ag-text-sm); }
    .msg-row { display: flex; }
    .msg-row.buyer { justify-content: flex-end; }
    .msg-row.artist { justify-content: flex-start; }

<script>
(function () {
  var STORAGE_KEY = 'ag_artist_chat';

  /* ===== 会话元数据 ===== */
  var SESSIONS = [
    { id: 'artist-chen', artist: '陈墨白', buyer: '张雅文', avatar: '../assets/art-portrait.jpg', online: true },
    { id: 'artist-li', artist: '李明华', buyer: '张雅文', avatar: '../assets/art-classical.jpg', online: false }
  ];

  /* 会话为空时的预置欢迎语 */
  var SEED = {
    'artist-chen': [ { role: 'artist', text: '您好！我是陈墨白，很高兴与您直接交流……', time: '08-10 09:00' } ],
    'artist-li': [ { role: 'artist', text: '您好！我是李明华……', time: '08-09 15:30' } ]
  };

  var state = {
    current: 'artist-chen',
    unread: { 'artist-chen': 0, 'artist-li': 0 },
    lastTotal: { 'artist-chen': 0, 'artist-li': 0 }
  };

  /* ===== localStorage 读写 ===== */
  function getData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      return (obj && typeof obj === 'object' && !Array.isArray(obj)) ? obj : {};
    } catch (e) { return {}; }
  }
  function saveData(obj) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(obj)); } catch (e) {}
  }

  /* ===== 预置欢迎语：会话为空时写入 ===== */
  function initData() {
    var obj = getData();
    var changed = false;
    Object.keys(SEED).forEach(function (sid) {
      var msgs = obj[sid];
      if (!msgs || !Array.isArray(msgs) || msgs.length === 0) {
        obj[sid] = SEED[sid].slice();
        changed = true;
      }
    });
    if (changed) { saveData(obj); }
  }

  /* ===== 通用工具 ===== */
  function getSession(sid) {
    for (var i = 0; i < SESSIONS.length; i++) {
      if (SESSIONS[i].id === sid) { return SESSIONS[i]; }
    }
    return null;
  }
  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function truncate(str, n) {
    str = String(str == null ? '' : str);
    if (str.length <= n) { return str; }
    return str.slice(0, n) + '…';
  }
  function nowTime() {
    var d = new Date();
    var p = function (n) { return ('0' + n).slice(-2); };
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ===== 会话列表渲染 ===== */
  function renderList() {
    var box = document.getElementById('conv-items');
    if (!box) { return; }
    var obj = getData();
    box.innerHTML = SESSIONS.map(function (s) {
      var msgs = obj[s.id] || [];
      var last = msgs.length ? msgs[msgs.length - 1] : null;
      var summary = last ? truncate(last.text, 20) : '暂无消息';
      var time = last ? (last.time || '') : '';
      var active = s.id === state.current;
      var hasUnread = (state.unread[s.id] || 0) > 0;
      return '<div class="conv-item' + (active ? ' active' : '') + (hasUnread ? ' has-unread' : '') + '" data-sid="' + s.id + '" role="button" tabindex="0" aria-label="与' + s.artist + '的会话">' +
        '<img class="conv-avatar" src="' + s.avatar + '" alt="">' +
        '<div class="conv-main">' +
          '<div class="conv-name-row">' +
            '<span class="conv-buyer">' + s.buyer + '</span>' +
            '<span class="conv-status ' + (s.online ? 'online' : 'offline') + '" title="' + (s.online ? '在线' : '离线') + '"></span>' +
          '</div>' +
          '<div class="conv-summary">' + s.artist + ' · ' + esc(summary) + '</div>' +
        '</div>' +
        '<div class="conv-right">' +
          '<div class="conv-time">' + esc(time) + '</div>' +
          '<div class="conv-dot" title="有新消息"></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ===== 对话区渲染 ===== */
  function renderMessages() {
    var box = document.getElementById('chat-messages');
    var sid = state.current;
    var s = getSession(sid);
    if (!box || !s) { return; }
    var msgs = (getData()[sid] || []);
    var avatarEl = document.getElementById('chat-header-avatar');
    if (avatarEl) { avatarEl.src = s.avatar; }
    var titleEl = document.getElementById('chat-header-title');
    if (titleEl) { titleEl.textContent = s.buyer; }
    var subEl = document.getElementById('chat-header-sub');
    if (subEl) { subEl.textContent = s.artist + ' · ' + (s.online ? '在线' : '离线'); }
    if (msgs.length === 0) {
      box.innerHTML = '<div class="chat-empty">暂无消息，等待买家发起咨询</div>';
      return;
    }
    box.innerHTML = msgs.map(function (m) {
      var isBuyer = m && m.role === 'buyer';
      return '<div class="msg-row ' + (isBuyer ? 'buyer' : 'artist') + '">' +
        '<div class="msg-bubble ' + (isBuyer ? 'msg-buyer' : 'msg-artist') + '">' +
          '<div class="msg-text">' + esc(m.text) + '</div>' +
          '<div class="msg-time">' + esc(m.time || '') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    box.scrollTop = box.scrollHeight;
  }

  /* ===== 切换会话 ===== */
  function selectSession(sid) {
    var s = getSession(sid);
    if (!s) { return; }
    state.current = sid;
    state.unread[sid] = 0;
    var msgs = getData()[sid] || [];
    state.lastTotal[sid] = msgs.length;
    renderList();
    renderMessages();
  }

  /* ===== 切换会话：事件委托 ===== */
  var convItems = document.getElementById('conv-items');
  if (convItems) {
    convItems.addEventListener('click', function (e) {
      var item = e.target.closest('.conv-item');
      if (item) { selectSession(item.getAttribute('data-sid')); }
    });
    convItems.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        var item = e.target.closest('.conv-item');
        if (item) { e.preventDefault(); selectSession(item.getAttribute('data-sid')); }
      }
    });
  }

  /* ===== 发送回复 ===== */
  function sendReply() {
    var input = document.getElementById('chat-input');
    var text = input ? input.value.trim() : '';
    if (!text) { if (input) { input.focus(); } return; }
    var sid = state.current;
    var obj = getData();
    var msgs = obj[sid] || [];
    msgs.push({ role: 'artist', text: text, time: nowTime() });
    obj[sid] = msgs;
    saveData(obj);
    if (input) { input.value = ''; }
    state.lastTotal[sid] = msgs.length;
    renderMessages();
    renderList();
    if (input) { input.focus(); }
  }

  var btnSend = document.getElementById('btn-send');
  if (btnSend) { btnSend.addEventListener('click', sendReply); }

  var chatInput = document.getElementById('chat-input');
  if (chatInput) {
    chatInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendReply();
      }
    });
  }

  /* ===== storage 事件：实时接收买家新消息 ===== */
  function handleIncoming() {
    var obj = getData();
    SESSIONS.forEach(function (s) {
      var msgs = obj[s.id] || [];
      var prev = state.lastTotal[s.id] || 0;
      if (msgs.length > prev) {
        var added = msgs.slice(prev);
        var buyerCount = 0;
        for (var i = 0; i < added.length; i++) {
          if (added[i] && added[i].role === 'buyer') { buyerCount++; }
        }
        if (buyerCount > 0) {
          if (s.id === state.current) {
            state.unread[s.id] = 0;
          } else {
            state.unread[s.id] = (state.unread[s.id] || 0) + buyerCount;
          }
        }
        state.lastTotal[s.id] = msgs.length;
      }
    });
    renderList();
    renderMessages();
  }

  window.addEventListener('storage', function (e) {
    if (e.key === STORAGE_KEY) { handleIncoming(); }
  });

  /* ===== 初始化 ===== */
  initData();
  SESSIONS.forEach(function (s) {
    var msgs = getData()[s.id] || [];
    state.lastTotal[s.id] = msgs.length;
  });
  renderList();
  renderMessages();
})();
</script>
