/* ==========================================================================
   ArtGallery Brand CSS — Deep Blue-Grey Art Platform
   Primary: #1A365D | States: Success #2E7D32, Warning #F57C00, Error #E53935
   ========================================================================== */

:root {
  /* --- Brand Primary Scale (#1A365D base) --- */
  --ag-primary-50: #F0F5FA;
  --ag-primary-100: #DCE7F2;
  --ag-primary-200: #B8CFE5;
  --ag-primary-300: #8FB0D2;
  --ag-primary-400: #5E87B5;
  --ag-primary-500: #3A6A9A;
  --ag-primary-600: #2A5279;
  --ag-primary-700: #1A365D;  /* === MAIN BRAND COLOR === */
  --ag-primary-800: #152B4A;
  --ag-primary-900: #102136;

  /* --- Neutral Scale (blue-grey) --- */
  --ag-neutral-50: #F8FAFC;
  --ag-neutral-100: #F1F5F9;
  --ag-neutral-200: #E2E8F0;
  --ag-neutral-300: #CBD5E1;
  --ag-neutral-400: #94A3B8;
  --ag-neutral-500: #64748B;
  --ag-neutral-600: #475569;
  --ag-neutral-700: #334155;
  --ag-neutral-800: #1E293B;
  --ag-neutral-900: #0F172A;

  /* --- State Colors (semantic status only) --- */
  --state-success: #2E7D32;
  --state-success-light: #E8F5E9;
  --state-success-dark: #1B5E20;
  --state-warning: #F57C00;
  --state-warning-light: #FFF3E0;
  --state-warning-dark: #E65100;
  --state-error: #E53935;
  --state-error-light: #FFEBEE;
  --state-error-dark: #C62828;
  --state-info: #1976D2;
  --state-info-light: #E3F2FD;

  /* --- Force Takedown (special dark-red) --- */
  --state-forced-takedown: #8B0000;
  --state-forced-takedown-light: #FCE4EC;

  /* --- Semantic Aliases (light mode) --- */
  --ag-background: #FFFFFF;
  --ag-foreground: #1E293B;
  --ag-card: #FFFFFF;
  --ag-card-foreground: #1E293B;
  --ag-popover: #FFFFFF;
  --ag-popover-foreground: #1E293B;
  --ag-primary: #1A365D;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #F1F5F9;
  --ag-muted-foreground: #64748B;
  --ag-border: #E2E8F0;
  --ag-input: #E2E8F0;
  --ag-ring: #1A365D;

  /* --- Radius --- */
  --ag-radius-small: 4px;
  --ag-radius-medium: 8px;
  --ag-radius-large: 12px;
  --ag-radius-full: 9999px;

  /* --- Typography --- */
  --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ag-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* --- Font Sizes --- */
  --ag-text-xs: 12px;
  --ag-text-sm: 13px;
  --ag-text-base: 14px;
  --ag-text-md: 15px;
  --ag-text-lg: 16px;
  --ag-text-xl: 18px;
  --ag-text-2xl: 20px;
  --ag-text-3xl: 24px;
  --ag-text-4xl: 28px;
  --ag-text-5xl: 32px;

  /* --- Shadows (floating layers only: modal, popover, dropdown) --- */
  --ag-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --ag-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --ag-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --ag-shadow-modal: 0 12px 40px rgba(0,0,0,0.16);
}

/* --- Dark Mode (optional, for admin dark panels) --- */
.dark {
  --ag-background: #0F172A;
  --ag-foreground: #E2E8F0;
  --ag-card: #1E293B;
  --ag-card-foreground: #E2E8F0;
  --ag-popover: #1E293B;
  --ag-popover-foreground: #E2E8F0;
  --ag-primary: #5E87B5;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #334155;
  --ag-muted-foreground: #94A3B8;
  --ag-border: #334155;
  --ag-input: #334155;
  --ag-ring: #5E87B5;
}

/* --- Base Typography --- */
body {
  font-family: var(--ag-font-sans);
  font-size: var(--ag-text-base);
  color: var(--ag-foreground);
  background: var(--ag-background);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Status Tag Utility Classes --- */
.tag-pending {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-warning-light);
  color: var(--state-warning-dark);
  white-space: nowrap;
}

.tag-approved {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-success-light);
  color: var(--state-success-dark);
  white-space: nowrap;
}

.tag-rejected {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-error-light);
  color: var(--state-error-dark);
  white-space: nowrap;
}

.tag-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-600);
  white-space: nowrap;
}

.tag-forced-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-forced-takedown-light);
  color: var(--state-forced-takedown);
  white-space: nowrap;
}

/* --- Button Utilities --- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-primary);
  color: var(--ag-primary-foreground);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: var(--ag-primary-600);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: #FFFFFF;
  color: var(--ag-primary);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover {
  background: var(--ag-primary-50);
}

.btn-disabled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-400);
  border: 1px solid var(--ag-neutral-200);
  cursor: not-allowed;
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: var(--state-error-dark);
}

    </style>

      --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ag-text-xs: 12px;
      --ag-text-sm: 13px;
      --ag-text-base: 14px;
      --ag-text-md: 15px;
      --ag-text-lg: 16px;
      --ag-text-xl: 18px;
      --ag-text-2xl: 20px;
      --ag-text-3xl: 24px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--ag-font-sans); font-size: var(--ag-text-base); color: var(--ag-foreground);
      background: var(--ag-neutral-100); line-height: 1.6; margin: 0; -webkit-font-smoothing: antialiased;
    }
    .tag-paid, .tag-shipped, .tag-completed, .tag-pending, .tag-closed {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 10px; border-radius: var(--ag-radius-small);
      font-size: var(--ag-text-xs); font-weight: 500; white-space: nowrap; min-height: 22px;
    }
    .tag-paid { background: var(--state-info-light); color: var(--state-info); }
    .tag-shipped { background: #FFF8E1; color: #F9A825; }
    .tag-completed { background: var(--state-success-light); color: var(--state-success-dark); }
    .tag-pending { background: var(--state-warning-light); color: var(--state-warning-dark); }
    .tag-closed { background: var(--ag-neutral-100); color: var(--ag-neutral-600); }
    .btn-primary, .btn-secondary, .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: var(--ag-radius-small); font-size: var(--ag-text-sm); font-weight: 500;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; border: 1px solid transparent;
      min-height: 44px; padding: 0 14px;
    }
    .btn-primary { background: var(--ag-primary); color: var(--ag-primary-foreground); border-color: var(--ag-primary); }
    .btn-primary:hover { background: var(--ag-primary-600); }
    .btn-secondary { background: #FFFFFF; color: var(--ag-primary); border-color: var(--ag-primary); }
    .btn-secondary:hover { background: var(--ag-primary-50); }
    .btn-ghost { background: transparent; color: var(--ag-neutral-600); border-color: var(--ag-border); }
    .btn-ghost:hover { background: var(--ag-neutral-50); }
    .mobile-frame {
      max-width: 414px; margin: 0 auto; min-height: 100vh; background: var(--ag-background);
      display: flex; flex-direction: column; position: relative; box-shadow: 0 0 24px rgba(0,0,0,0.06);
    }
    .admin-header {
      height: 56px; background: var(--ag-primary); color: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px; position: sticky; top: 0; z-index: 30;
    }
    .header-title { font-size: var(--ag-text-lg); font-weight: 600; }
    .content { flex: 1; overflow-y: auto; padding: 12px 16px 80px; }
    .search-bar {
      display: flex; gap: 10px; margin-bottom: 14px;
    }
    .search-input-wrap {
      flex: 1; position: relative;
    }
    .search-input-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--ag-neutral-400); pointer-events: none;
    }
    #search-orders {
      width: 100%; height: 44px; padding: 0 12px 0 36px;
      border: 1px solid var(--ag-border); border-radius: var(--ag-radius-medium);
      background: var(--ag-card); font-size: var(--ag-text-base); color: var(--ag-foreground);
      outline: none;
    }
    #search-orders:focus { border-color: var(--ag-primary); }
    #search-orders::placeholder { color: var(--ag-neutral-400); }
    #btn-filter {
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      border-radius: var(--ag-radius-medium); border: 1px solid var(--ag-border);
      background: var(--ag-card); color: var(--ag-foreground); cursor: pointer;
    }
    .order-list { display: flex; flex-direction: column; gap: 12px; }
    .order-card {
      background: var(--ag-card); border: 1px solid var(--ag-border); border-radius: var(--ag-radius-large);
      padding: 14px 16px;
    }
    .order-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .order-no { font-family: var(--ag-font-mono); font-size: var(--ag-text-sm); color: var(--ag-primary); font-weight: 600; }
    .order-buyer { font-size: var(--ag-text-sm); color: var(--ag-neutral-600); margin-top: 4px; }
    .order-artwork { font-size: var(--ag-text-base); font-weight: 600; color: var(--ag-foreground); margin-top: 8px; }
    .order-info { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .order-amount { font-size: var(--ag-text-lg); font-weight: 700; color: var(--ag-primary); font-variant-numeric: tabular-nums; }
    .order-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .bottom-nav {
      height: 56px; background: #FFFFFF; border-top: 1px solid var(--ag-border);
      display: grid; grid-template-columns: repeat(4, 1fr); position: sticky; bottom: 0; z-index: 30;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; color: var(--ag-neutral-500); text-decoration: none; font-size: 11px;
      cursor: pointer; min-height: 44px;
    }
    .nav-item.active { color: var(--ag-primary); font-weight: 600; }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
    <style>
    .order-tabs {
      display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--ag-border);
      background: var(--ag-card); margin-bottom: 12px; -ms-overflow-style: none; scrollbar-width: none;
    }
    .order-tab {
      flex: 1; min-width: 62px; white-space: nowrap; display: flex; align-items: center; justify-content: center;
      min-height: 44px; font-size: var(--ag-text-sm); color: var(--ag-neutral-500); background: transparent;
      border: none; border-bottom: 2px solid transparent; cursor: pointer; padding: 0 6px; font-weight: 500;
    }
    .order-tab.active { color: var(--ag-primary); border-bottom-color: var(--ag-primary); }
    .order-actions { gap: 8px; }
    </style>
    <script>
    (function() {
      // 订单状态 tab 筛选
      var tabs = document.querySelectorAll('.order-tab');
      var cards = document.querySelectorAll('.order-card');
      function statusOf(card) {
        var tag = card.querySelector('.order-row span[class*="tag-"]');
        if (!tag) return '';
        var c = tag.className;
        if (c.indexOf('tag-pending') > -1) return 'pending';
        if (c.indexOf('tag-paid') > -1) return 'paid';
        if (c.indexOf('tag-shipped') > -1) return 'shipped';
        if (c.indexOf('tag-completed') > -1) return 'completed';
        return '';
      }
      function applyFilter(status) {
        tabs.forEach(function(t) {
          var on = t.getAttribute('data-status') === status;
          t.classList.toggle('active', on);
          t.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        cards.forEach(function(card) {
          card.style.display = (status === 'all' || statusOf(card) === status) ? '' : 'none';
        });
      }
      tabs.forEach(function(t) {
        t.addEventListener('click', function() { applyFilter(t.getAttribute('data-status')); });
      });
      // 筛选下拉
      var filterBtn = document.getElementById('btn-filter');
      if (filterBtn) {
        var dd = document.createElement('div');
        dd.id = 'filter-dropdown';
        dd.style.cssText = 'position:absolute;top:100%;right:0;margin-top:4px;background:var(--ag-card);border:1px solid var(--ag-border);border-radius:var(--ag-radius-medium);box-shadow:var(--ag-shadow-md);z-index:50;min-width:150px;display:none;overflow:hidden;';
        [['all', '全部'], ['pending', '待支付'], ['paid', '待发货'], ['shipped', '运输中'], ['completed', '已完成']].forEach(function(o) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = o[1];
          b.style.cssText = 'display:block;width:100%;text-align:left;padding:10px 14px;background:transparent;border:none;color:var(--ag-foreground);font-size:var(--ag-text-base);cursor:pointer;';
          b.addEventListener('mouseenter', function() { b.style.background = 'var(--ag-primary-50)'; });
          b.addEventListener('mouseleave', function() { b.style.background = 'transparent'; });
          b.addEventListener('click', function() { applyFilter(o[0]); dd.style.display = 'none'; });
          dd.appendChild(b);
        });
        var wrap = document.querySelector('.search-bar');
        if (wrap) {
          wrap.style.position = 'relative';
          wrap.appendChild(dd);
        }
        filterBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
        });
        document.addEventListener('click', function(e) {
          if (!dd.contains(e.target) && e.target !== filterBtn) dd.style.display = 'none';
        });
      }
      // 搜索
      var search = document.getElementById('search-orders');
      if (search) {
        search.addEventListener('input', function() {
          var q = search.value.trim().toLowerCase();
          cards.forEach(function(card) {
            card.style.display = (q === '' || card.textContent.toLowerCase().indexOf(q) > -1) ? '' : 'none';
          });
        });
      }
      // 发货（模拟）
      var ship = document.getElementById('ship-1');
      if (ship) {
        ship.addEventListener('click', function() {
          if (window.confirm('确认已安排发货？')) {
            alert('已发货');
            var card = ship.closest('.order-card');
            var tag = card.querySelector('.order-row span[class*="tag-"]');
            tag.className = 'tag-shipped'; tag.textContent = '运输中';
            ship.disabled = true; ship.style.opacity = '0.5'; ship.style.cursor = 'not-allowed'; ship.textContent = '已发货';
          }
        });
      }
      // 处理（模拟）
      var handleBtn = document.getElementById('handle-2');
      if (handleBtn) {
        handleBtn.addEventListener('click', function() {
          if (window.confirm('确认买家已签收，订单完成？')) {
            alert('订单已标记为完成');
            var card = handleBtn.closest('.order-card');
            var tag = card.querySelector('.order-row span[class*="tag-"]');
            tag.className = 'tag-completed'; tag.textContent = '已完成';
            handleBtn.disabled = true; handleBtn.style.opacity = '0.5'; handleBtn.style.cursor = 'not-allowed'; handleBtn.textContent = '已完成';
          }
        });
      }
      // 查看详情（模拟）
      document.querySelectorAll('[id^="order-detail-"]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var card = btn.closest('.order-card');
          alert('订单详情\n' + card.querySelector('.order-no').textContent.trim() + '\n' + card.querySelector('.order-buyer').textContent.trim() + '\n' + card.querySelector('.order-artwork').textContent.trim() + '\n金额：' + card.querySelector('.order-amount').textContent.trim());
        });
      });
      // 底部导航「我的」（模拟）
      var navProfile = document.getElementById('nav-profile');
      if (navProfile) { navProfile.addEventListener('click', function(e) { e.preventDefault(); alert('个人中心即将上线'); }); }
    })();
    </script>
</body>
</html>
