    <style id="theme-vars">
/* ==========================================================================
   ArtGallery Brand CSS — Deep Blue-Grey Art Platform
   Primary: #1A365D | States: Success #2E7D32, Warning #F57C00, Error #E53935
   ========================================================================== */

:root {
  /* --- Brand Primary Scale (#1A365D base) --- */
  --ag-primary-50: #F0F5FA;
  --ag-primary-100: #DCE7F2;
  --ag-primary-200: #B8CFE5;
  --ag-primary-300: #8FB0D2;
  --ag-primary-400: #5E87B5;
  --ag-primary-500: #3A6A9A;
  --ag-primary-600: #2A5279;
  --ag-primary-700: #1A365D;  /* === MAIN BRAND COLOR === */
  --ag-primary-800: #152B4A;
  --ag-primary-900: #102136;

  /* --- Neutral Scale (blue-grey) --- */
  --ag-neutral-50: #F8FAFC;
  --ag-neutral-100: #F1F5F9;
  --ag-neutral-200: #E2E8F0;
  --ag-neutral-300: #CBD5E1;
  --ag-neutral-400: #94A3B8;
  --ag-neutral-500: #64748B;
  --ag-neutral-600: #475569;
  --ag-neutral-700: #334155;
  --ag-neutral-800: #1E293B;
  --ag-neutral-900: #0F172A;

  /* --- State Colors (semantic status only) --- */
  --state-success: #2E7D32;
  --state-success-light: #E8F5E9;
  --state-success-dark: #1B5E20;
  --state-warning: #F57C00;
  --state-warning-light: #FFF3E0;
  --state-warning-dark: #E65100;
  --state-error: #E53935;
  --state-error-light: #FFEBEE;
  --state-error-dark: #C62828;
  --state-info: #1976D2;
  --state-info-light: #E3F2FD;

  /* --- Force Takedown (special dark-red) --- */
  --state-forced-takedown: #8B0000;
  --state-forced-takedown-light: #FCE4EC;

  /* --- Semantic Aliases (light mode) --- */
  --ag-background: #FFFFFF;
  --ag-foreground: #1E293B;
  --ag-card: #FFFFFF;
  --ag-card-foreground: #1E293B;
  --ag-popover: #FFFFFF;
  --ag-popover-foreground: #1E293B;
  --ag-primary: #1A365D;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #F1F5F9;
  --ag-muted-foreground: #64748B;
  --ag-border: #E2E8F0;
  --ag-input: #E2E8F0;
  --ag-ring: #1A365D;

  /* --- Radius --- */
  --ag-radius-small: 4px;
  --ag-radius-medium: 8px;
  --ag-radius-large: 12px;
  --ag-radius-full: 9999px;

  /* --- Typography --- */
  --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ag-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* --- Font Sizes --- */
  --ag-text-xs: 12px;
  --ag-text-sm: 13px;
  --ag-text-base: 14px;
  --ag-text-md: 15px;
  --ag-text-lg: 16px;
  --ag-text-xl: 18px;
  --ag-text-2xl: 20px;
  --ag-text-3xl: 24px;
  --ag-text-4xl: 28px;
  --ag-text-5xl: 32px;

  /* --- Shadows (floating layers only: modal, popover, dropdown) --- */
  --ag-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --ag-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --ag-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --ag-shadow-modal: 0 12px 40px rgba(0,0,0,0.16);
}

/* --- Dark Mode (optional, for admin dark panels) --- */
.dark {
  --ag-background: #0F172A;
  --ag-foreground: #E2E8F0;
  --ag-card: #1E293B;
  --ag-card-foreground: #E2E8F0;
  --ag-popover: #1E293B;
  --ag-popover-foreground: #E2E8F0;
  --ag-primary: #5E87B5;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #334155;
  --ag-muted-foreground: #94A3B8;
  --ag-border: #334155;
  --ag-input: #334155;
  --ag-ring: #5E87B5;
}

/* --- Base Typography --- */
body {
  font-family: var(--ag-font-sans);
  font-size: var(--ag-text-base);
  color: var(--ag-foreground);
  background: var(--ag-background);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Status Tag Utility Classes --- */
.tag-pending {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-warning-light);
  color: var(--state-warning-dark);
  white-space: nowrap;
}

.tag-approved {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-success-light);
  color: var(--state-success-dark);
  white-space: nowrap;
}

.tag-rejected {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-error-light);
  color: var(--state-error-dark);
  white-space: nowrap;
}

.tag-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-600);
  white-space: nowrap;
}

.tag-forced-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-forced-takedown-light);
  color: var(--state-forced-takedown);
  white-space: nowrap;
}

/* --- Button Utilities --- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-primary);
  color: var(--ag-primary-foreground);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: var(--ag-primary-600);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: #FFFFFF;
  color: var(--ag-primary);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover {
  background: var(--ag-primary-50);
}

.btn-disabled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-400);
  border: 1px solid var(--ag-neutral-200);
  cursor: not-allowed;
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: var(--state-error-dark);
}

<main>
<style id="critical-layout">
  /* === Mobile Frame === */
  .mobile-frame {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--ag-background);
    position: relative;
  }

  /* === Sticky Top Bar === */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: #FFFFFF;
    border-bottom: 1px solid #E2E8F0;
  }
  .top-bar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
  }
  .top-bar-title {
    font-size: 16px;
    font-weight: 700;
    color: #1E293B;
    margin: 0;
    line-height: 1.3;
  }
  .top-bar-edit {
    font-size: 14px;
    color: #64748B;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 8px;
    min-height: 36px;
    min-width: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }
  .top-bar-edit:hover {
    color: #1A365D;
    background: #F0F5FA;
  }
  .top-bar-edit:focus-visible {
    outline: 2px solid #1A365D;
    outline-offset: 2px;
  }

  /* === Cart List === */
  .cart-list {
    background: #F8FAFC;
    padding: 8px 0 16px;
  }

  /* === Cart Item === */
  .cart-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 16px;
    background: #FFFFFF;
    border-bottom: 1px solid #E2E8F0;
  }
  .cart-item:first-child {
    border-top: 1px solid #E2E8F0;
  }

  /* === Checkbox === */
  .cart-check {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    border-radius: 4px;
  }
  .cart-check:focus-visible {
    outline: 2px solid #1A365D;
    outline-offset: 1px;
  }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 2px solid #CBD5E1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    transition: background 0.15s, border-color 0.15s;
  }
  .check-box.is-checked {
    background: #1A365D;
    border-color: #1A365D;
  }
  .check-box svg {
    opacity: 0;
    transition: opacity 0.15s;
  }
  .check-box.is-checked svg {
    opacity: 1;
  }

  /* === Thumbnail === */
  .cart-thumb {
    width: 80px;
    height: 80px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    display: block;
  }

  /* === Cart Info === */
  .cart-info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 80px;
    gap: 8px;
  }
  .cart-info-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .cart-info-text {
    min-width: 0;
    flex: 1;
  }
  .cart-name {
    font-size: 15px;
    font-weight: 600;
    color: #1E293B;
    line-height: 1.3;
    margin: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cart-artist {
    font-size: 13px;
    color: #64748B;
    margin: 2px 0 0 0;
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .del-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #94A3B8;
    padding: 0;
    border-radius: 4px;
    transition: color 0.15s, background 0.15s;
  }
  .del-btn:hover {
    color: #E53935;
    background: #FFEBEE;
  }
  .del-btn:focus-visible {
    outline: 2px solid #1A365D;
    outline-offset: 1px;
  }
  .cart-info-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .cart-price {
    font-size: 16px;
    font-weight: 700;
    color: #1A365D;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  /* === Quantity Stepper === */
  .qty-stepper {
    display: inline-flex;
    align-items: center;
    border: 1px solid #E2E8F0;
    border-radius: 4px;
    overflow: hidden;
  }
  .qty-stepper button {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F8FAFC;
    border: none;
    cursor: pointer;
    color: #1E293B;
    padding: 0;
    transition: background 0.15s;
  }
  .qty-stepper button:hover {
    background: #F1F5F9;
  }
  .qty-stepper button:active {
    background: #E2E8F0;
  }
  .qty-stepper button:focus-visible {
    outline: 2px solid #1A365D;
    outline-offset: -2px;
  }
  .qty-stepper button:disabled {
    color: #CBD5E1;
    cursor: not-allowed;
    background: #F8FAFC;
  }
  .qty-stepper .qty-val {
    min-width: 36px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 500;
    color: #1E293B;
    border-left: 1px solid #E2E8F0;
    border-right: 1px solid #E2E8F0;
    font-variant-numeric: tabular-nums;
    background: #FFFFFF;
  }

  /* === Checkout Bar (sticky above bottom nav) === */
  .checkout-bar {
    position: sticky;
    bottom: 56px;
    z-index: 29;
    background: #FFFFFF;
    border-top: 1px solid #E2E8F0;
  }
  .checkout-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    gap: 8px;
  }
  .checkout-left {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .check-all-btn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    border-radius: 4px;
  }
  .check-all-btn:focus-visible {
    outline: 2px solid #1A365D;
    outline-offset: 1px;
  }
  .select-all-label {
    font-size: 14px;
    color: #1E293B;
    white-space: nowrap;
  }
  .checkout-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .checkout-total {
    text-align: right;
  }
  .total-label {
    font-size: 12px;
    color: #64748B;
    display: block;
    line-height: 1.4;
  }
  .total-amount {
    font-size: 18px;
    font-weight: 700;
    color: #1A365D;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
    display: block;
  }
  .checkout-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 24px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 600;
    background: #1A365D;
    color: #FFFFFF;
    border: 1px solid #1A365D;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: background 0.15s;
    min-height: 44px;
  }
  .checkout-btn:hover {
    background: #2A5279;
  }
  .checkout-btn:active {
    background: #152B4A;
  }
  .checkout-btn:focus-visible {
    outline: 2px solid #1A365D;
    outline-offset: 2px;
  }

  /* === Bottom Nav === */
  [data-mobile-nav="global"] {
    position: sticky;
    bottom: 0;
    z-index: 30;
  }

  @media (prefers-reduced-motion: reduce) {
    .animate-spin { animation: none !important; }
    * { transition-duration: 0.01ms !important; }
  }
</style>

        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[11px] leading-none whitespace-nowrap">我的</span>

</main>
<script>
(function(){
  function money(n){
    return '$' + Math.round(n).toLocaleString('en-US');
  }
  var items = Array.prototype.slice.call(document.querySelectorAll('.cart-item'));
  var basePrices = items.map(function(item){
    return parseFloat(item.querySelector('.cart-price').textContent.replace(/[$,]/g, '')) || 0;
  });
  var totalEl = document.querySelector('.total-amount');
  var checkoutBtn = document.querySelector('[data-dom-id="btn-checkout"]');

  function qtyOf(item){ return parseInt(item.querySelector('.qty-val').textContent, 10) || 1; }
  function checkedOf(item){ return item.querySelector('.check-box').classList.contains('is-checked'); }
  function setChecked(item, checked){
    var box = item.querySelector('.check-box');
    var btn = item.querySelector('.cart-check');
    if (checked) { box.classList.add('is-checked'); } else { box.classList.remove('is-checked'); }
    if (btn) { btn.setAttribute('aria-pressed', checked ? 'true' : 'false'); }
  }
  function refreshItem(item, idx){
    var priceEl = item.querySelector('.cart-price');
    if (priceEl) { priceEl.textContent = money(basePrices[idx] * qtyOf(item)); }
  }
  function refreshTotal(){
    var total = 0, count = 0;
    for (var i = 0; i < items.length; i++) {
      refreshItem(items[i], i);
      if (checkedOf(items[i])) { total += basePrices[i] * qtyOf(items[i]); count++; }
    }
    if (totalEl) { totalEl.textContent = money(total); }
    if (checkoutBtn) { checkoutBtn.textContent = '结算(' + count + ')'; }
    var checkAll = document.querySelector('[data-dom-id="check-all"]');
    if (checkAll) {
      var allChecked = items.length > 0 && items.every(function(item){ return checkedOf(item); });
      var allBox = checkAll.querySelector('.check-box');
      if (allBox) {
        if (allChecked) { allBox.classList.add('is-checked'); } else { allBox.classList.remove('is-checked'); }
      }
      checkAll.setAttribute('aria-pressed', allChecked ? 'true' : 'false');
    }
  }

  for (var i = 0; i < items.length; i++) {
    (function(item){
      var dec = item.querySelector('[data-dom-id^="qty-dec-"]');
      var inc = item.querySelector('[data-dom-id^="qty-inc-"]');
      var val = item.querySelector('.qty-val');
      function update(){
        var q = qtyOf(item);
        if (dec) { dec.disabled = (q <= 1); }
        refreshTotal();
      }
      if (dec) {
        dec.disabled = true;
        dec.addEventListener('click', function(){
          var q = qtyOf(item);
          if (q > 1) { val.textContent = q - 1; }
          update();
        });
      }
      if (inc) {
        inc.addEventListener('click', function(){
          val.textContent = qtyOf(item) + 1;
          update();
        });
      }
      var checkBtn = item.querySelector('.cart-check');
      if (checkBtn) {
        checkBtn.addEventListener('click', function(){
          setChecked(item, !checkedOf(item));
          refreshTotal();
        });
      }
      var delBtn = item.querySelector('.del-btn');
      if (delBtn) {
        delBtn.addEventListener('click', function(){
          var idx = items.indexOf(item);
          if (idx !== -1) {
            items.splice(idx, 1);
            basePrices.splice(idx, 1);
          }
          item.parentNode.removeChild(item);
          refreshTotal();
          if (items.length === 0) {
            alert('购物车已空，请去逛逛');
          }
        });
      }
    })(items[i]);
  }

  // Select all toggle
  var checkAll = document.querySelector('[data-dom-id="check-all"]');
  if (checkAll) {
    checkAll.addEventListener('click', function(){
      var allChecked = items.length > 0 && items.every(function(item){ return checkedOf(item); });
      for (var j = 0; j < items.length; j++) { setChecked(items[j], !allChecked); }
      refreshTotal();
    });
  }

  // Edit mode toggle
  var editBtn = document.querySelector('[data-dom-id="btn-edit"]');
  if (editBtn) {
    editBtn.addEventListener('click', function(){
      var editing = editBtn.textContent === '编辑';
      editBtn.textContent = editing ? '完成' : '编辑';
      if (!editing) { alert('已完成编辑'); }
    });
  }

  // Checkout guard: at least one selected item
  if (checkoutBtn) {
    checkoutBtn.addEventListener('click', function(e){
      var count = 0;
      for (var c = 0; c < items.length; c++) { if (checkedOf(items[c])) { count++; } }
      if (count === 0) {
        e.preventDefault();
        alert('请先选择商品');
      }
    });
  }

  refreshTotal();
})();
</script>
