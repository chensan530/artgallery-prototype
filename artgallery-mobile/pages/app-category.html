/* ==========================================================================
   ArtGallery Brand CSS — Deep Blue-Grey Art Platform
   Primary: #1A365D | States: Success #2E7D32, Warning #F57C00, Error #E53935
   ========================================================================== */

:root {
  /* --- Brand Primary Scale (#1A365D base) --- */
  --ag-primary-50: #F0F5FA;
  --ag-primary-100: #DCE7F2;
  --ag-primary-200: #B8CFE5;
  --ag-primary-300: #8FB0D2;
  --ag-primary-400: #5E87B5;
  --ag-primary-500: #3A6A9A;
  --ag-primary-600: #2A5279;
  --ag-primary-700: #1A365D;  /* === MAIN BRAND COLOR === */
  --ag-primary-800: #152B4A;
  --ag-primary-900: #102136;

  /* --- Neutral Scale (blue-grey) --- */
  --ag-neutral-50: #F8FAFC;
  --ag-neutral-100: #F1F5F9;
  --ag-neutral-200: #E2E8F0;
  --ag-neutral-300: #CBD5E1;
  --ag-neutral-400: #94A3B8;
  --ag-neutral-500: #64748B;
  --ag-neutral-600: #475569;
  --ag-neutral-700: #334155;
  --ag-neutral-800: #1E293B;
  --ag-neutral-900: #0F172A;

  /* --- State Colors (semantic status only) --- */
  --state-success: #2E7D32;
  --state-success-light: #E8F5E9;
  --state-success-dark: #1B5E20;
  --state-warning: #F57C00;
  --state-warning-light: #FFF3E0;
  --state-warning-dark: #E65100;
  --state-error: #E53935;
  --state-error-light: #FFEBEE;
  --state-error-dark: #C62828;
  --state-info: #1976D2;
  --state-info-light: #E3F2FD;

  /* --- Force Takedown (special dark-red) --- */
  --state-forced-takedown: #8B0000;
  --state-forced-takedown-light: #FCE4EC;

  /* --- Semantic Aliases (light mode) --- */
  --ag-background: #FFFFFF;
  --ag-foreground: #1E293B;
  --ag-card: #FFFFFF;
  --ag-card-foreground: #1E293B;
  --ag-popover: #FFFFFF;
  --ag-popover-foreground: #1E293B;
  --ag-primary: #1A365D;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #F1F5F9;
  --ag-muted-foreground: #64748B;
  --ag-border: #E2E8F0;
  --ag-input: #E2E8F0;
  --ag-ring: #1A365D;

  /* --- Radius --- */
  --ag-radius-small: 4px;
  --ag-radius-medium: 8px;
  --ag-radius-large: 12px;
  --ag-radius-full: 9999px;

  /* --- Typography --- */
  --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ag-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* --- Font Sizes --- */
  --ag-text-xs: 12px;
  --ag-text-sm: 13px;
  --ag-text-base: 14px;
  --ag-text-md: 15px;
  --ag-text-lg: 16px;
  --ag-text-xl: 18px;
  --ag-text-2xl: 20px;
  --ag-text-3xl: 24px;
  --ag-text-4xl: 28px;
  --ag-text-5xl: 32px;

  /* --- Shadows (floating layers only: modal, popover, dropdown) --- */
  --ag-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --ag-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --ag-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --ag-shadow-modal: 0 12px 40px rgba(0,0,0,0.16);
}

/* --- Dark Mode (optional, for admin dark panels) --- */
.dark {
  --ag-background: #0F172A;
  --ag-foreground: #E2E8F0;
  --ag-card: #1E293B;
  --ag-card-foreground: #E2E8F0;
  --ag-popover: #1E293B;
  --ag-popover-foreground: #E2E8F0;
  --ag-primary: #5E87B5;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #334155;
  --ag-muted-foreground: #94A3B8;
  --ag-border: #334155;
  --ag-input: #334155;
  --ag-ring: #5E87B5;
}

/* --- Base Typography --- */
body {
  font-family: var(--ag-font-sans);
  font-size: var(--ag-text-base);
  color: var(--ag-foreground);
  background: var(--ag-background);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Status Tag Utility Classes --- */
.tag-pending {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-warning-light);
  color: var(--state-warning-dark);
  white-space: nowrap;
}

.tag-approved {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-success-light);
  color: var(--state-success-dark);
  white-space: nowrap;
}

.tag-rejected {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-error-light);
  color: var(--state-error-dark);
  white-space: nowrap;
}

.tag-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-600);
  white-space: nowrap;
}

.tag-forced-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-forced-takedown-light);
  color: var(--state-forced-takedown);
  white-space: nowrap;
}

/* --- Button Utilities --- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-primary);
  color: var(--ag-primary-foreground);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: var(--ag-primary-600);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: #FFFFFF;
  color: var(--ag-primary);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover {
  background: var(--ag-primary-50);
}

.btn-disabled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-400);
  border: 1px solid var(--ag-neutral-200);
  cursor: not-allowed;
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: var(--state-error-dark);
}

<style id="critical-layout">
  .mobile-frame {
    max-width: 414px;
    margin: 0 auto;

  }

  [data-mobile-nav="global"] {
    position: sticky;
    bottom: 0;

  }
  .masonry-grid {
    column-count: 2;
    column-gap: 8px;
  }
  .masonry-card {

    margin-bottom: 8px;

  }
  .filter-overlay {
    position: absolute;

    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .filter-backdrop {
    position: absolute;
    inset: 0;

    position: relative;
    background: #FFFFFF;
    border-radius: 12px 12px 0 0;

  .radio-row {
    display: flex;
    gap: 8px;
  }
  .radio-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 8px;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    font-size: 13px;
    color: #64748B;
    white-space: nowrap;
    cursor: pointer;
  }
  .radio-option-selected {
    border-color: #1A365D;
    background: #F0F5FA;
    color: #1A365D;
    font-weight: 500;
  }
  .price-input {
    flex: 1;
    min-width: 0;
    height: 40px;
    padding: 0 12px;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    font-size: 14px;
    color: #1E293B;
    background: #FFFFFF;
    outline: none;
  }
  .price-input:focus {
    border-color: #1A365D;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

      <a data-nav-key="nav-category" data-active="true" id="nav-category" href="app-category.html" data-dom-id="nav-category" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[#1A365D] font-medium">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span class="text-[11px] leading-none whitespace-nowrap">分类</span>
      </a>
      <a data-nav-key="nav-cart" id="nav-cart" href="app-cart.html" data-dom-id="nav-cart" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[#64748B]">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <span class="text-[11px] leading-none whitespace-nowrap">购物车</span>
      </a>
      <a data-nav-key="nav-profile" id="nav-profile" href="app-profile.html" data-dom-id="nav-profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[#64748B]">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[11px] leading-none whitespace-nowrap">我的</span>
      </a>
    </div>
  </nav>

  <!-- Filter Bottom Sheet (overlay) -->
  <div class="filter-overlay" role="dialog" aria-modal="true" aria-label="筛选">
    <div class="filter-backdrop" aria-hidden="true"></div>
    <div class="filter-sheet">
      <!-- Sheet Header -->
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-[18px] font-bold text-[#1E293B] leading-tight">筛选</h2>
        <button type="button" aria-label="关闭筛选" class="w-8 h-8 flex items-center justify-center text-[#64748B] shrink-0 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Price Range -->
      <div class="mb-5">
        <div class="text-[14px] font-semibold text-[#1E293B] mb-3">价格区间</div>
        <div class="flex items-center gap-2">
          <input type="number" min="0" placeholder="$0" aria-label="最低价格" class="price-input"/>
          <span class="text-[#94A3B8] text-[14px] shrink-0">-</span>
          <input type="number" max="10000" placeholder="$10000" aria-label="最高价格" class="price-input"/>
        </div>
      </div>

      <!-- Artist Type -->
      <div class="mb-6">
        <div class="text-[14px] font-semibold text-[#1E293B] mb-3">艺术家类型</div>
        <div class="radio-row">
          <label class="radio-option radio-option-selected">
            <input type="radio" name="artist-type" value="all" checked class="sr-only"/>
            <span>全部</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="artist-type" value="individual" class="sr-only"/>
            <span>个人艺术家</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="artist-type" value="institution" class="sr-only"/>
            <span>艺术机构</span>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col gap-2">
        <button data-dom-id="filter-confirm" type="button" class="btn-primary w-full" style="padding: 12px 20px; font-size: 15px;">确认筛选</button>
        <button data-dom-id="filter-reset" type="button" class="btn-secondary w-full" style="padding: 12px 20px; font-size: 15px;">重置</button>
      </div>
    </div>
  </div>
</div>
</main>
<script>
(function(){
  var grid = document.querySelector('.masonry-grid');
  var cards = grid ? Array.prototype.slice.call(grid.querySelectorAll('.masonry-card')) : [];
  var originalOrder = cards.slice();

  // --- Top category tabs: active switch + simple list filter ---
  var filters = {
    'tab-abstract': ['artwork-1','artwork-2','artwork-3','artwork-4'],
    'tab-classical': ['artwork-1'],
    'tab-religious': ['artwork-3'],
    'tab-portrait': ['artwork-2']
  };
  var tabs = document.querySelectorAll('.tab-item');
  for (var t = 0; t < tabs.length; t++) {
    (function(tab){
      tab.addEventListener('click', function(){
        for (var j = 0; j < tabs.length; j++) {
          tabs[j].classList.remove('tab-item-active');
          tabs[j].classList.add('tab-item-default');
        }
        tab.classList.add('tab-item-active');
        tab.classList.remove('tab-item-default');
        var show = filters[tab.getAttribute('data-dom-id')] || [];
        for (var k = 0; k < cards.length; k++) {
          cards[k].style.display = (show.indexOf(cards[k].getAttribute('data-dom-id')) !== -1) ? '' : 'none';
        }
      });
    })(tabs[t]);
  }

  // --- Sort bar (latest / price asc / price desc) ---
  function parsePrice(card){
    var el = card.querySelector('.font-bold');
    if (!el) { return 0; }
    return parseFloat(el.textContent.replace(/[$,]/g, '')) || 0;
  }
  var sortBtns = document.querySelectorAll('.sort-item');
  function setSortActive(btn){
    for (var i = 0; i < sortBtns.length; i++) {
      sortBtns[i].classList.remove('sort-item-active');
    }
    btn.classList.add('sort-item-active');
  }
  function resort(order){
    if (!grid) { return; }
    for (var i = 0; i < order.length; i++) { grid.appendChild(order[i]); }
    cards = order.slice();
  }
  for (var s = 0; s < sortBtns.length; s++) {
    (function(btn){
      btn.addEventListener('click', function(){
        setSortActive(btn);
        var key = btn.getAttribute('data-dom-id');
        var order;
        if (key === 'sort-price-asc') {
          order = cards.slice().sort(function(a, b){ return parsePrice(a) - parsePrice(b); });
        } else if (key === 'sort-price-desc') {
          order = cards.slice().sort(function(a, b){ return parsePrice(b) - parsePrice(a); });
        } else {
          order = originalOrder.slice();
        }
        resort(order);
      });
    })(sortBtns[s]);
  }

  // --- Filter bottom sheet (hidden by default) ---
  var overlay = document.querySelector('.filter-overlay');
  if (overlay) {
    overlay.style.display = 'none';
    function openSheet(){ overlay.style.display = 'flex'; }
    function closeSheet(){ overlay.style.display = 'none'; }

    var filterBtn = document.querySelector('[data-dom-id="filter-btn"]');
    if (filterBtn) { filterBtn.addEventListener('click', openSheet); }

    var closeBtns = overlay.querySelectorAll('.filter-backdrop, button[aria-label="关闭筛选"]');
    for (var c = 0; c < closeBtns.length; c++) {
      closeBtns[c].addEventListener('click', closeSheet);
    }

    var confirmBtn = document.querySelector('[data-dom-id="filter-confirm"]');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function(){
        closeSheet();
        alert('已应用筛选条件');
      });
    }

    var resetBtn = document.querySelector('[data-dom-id="filter-reset"]');
    if (resetBtn) {
      resetBtn.addEventListener('click', function(){
        var inputs = overlay.querySelectorAll('.price-input');
        for (var i = 0; i < inputs.length; i++) { inputs[i].value = ''; }
        var radios = overlay.querySelectorAll('input[name="artist-type"]');
        for (var r = 0; r < radios.length; r++) {
          radios[r].checked = (radios[r].value === 'all');
        }
        var labels = overlay.querySelectorAll('.radio-option');
        for (var l = 0; l < labels.length; l++) {
          if (labels[l].querySelector('input') && labels[l].querySelector('input').checked) {
            labels[l].classList.add('radio-option-selected');
          } else {
            labels[l].classList.remove('radio-option-selected');
          }
        }
        closeSheet();
        alert('已重置筛选条件');
      });
    }

    // Radio option select state
    var labels = overlay.querySelectorAll('.radio-option');
    for (var rl = 0; rl < labels.length; rl++) {
      (function(label){
        label.addEventListener('click', function(){
          var row = label.parentElement;
          var options = row.querySelectorAll('.radio-option');
          for (var o = 0; o < options.length; o++) {
            options[o].classList.remove('radio-option-selected');
          }
          label.classList.add('radio-option-selected');
          var input = label.querySelector('input[type="radio"]');
          if (input) { input.checked = true; }
        });
      })(labels[rl]);
    }

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && overlay.style.display !== 'none') { closeSheet(); }
    });
  }
})();
</script>
</body>
</html>
