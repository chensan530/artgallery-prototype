/* ==========================================================================
   ArtGallery Brand CSS — Deep Blue-Grey Art Platform
   Primary: #1A365D | States: Success #2E7D32, Warning #F57C00, Error #E53935
   ========================================================================== */

:root {
  /* --- Brand Primary Scale (#1A365D base) --- */
  --ag-primary-50: #F0F5FA;
  --ag-primary-100: #DCE7F2;
  --ag-primary-200: #B8CFE5;
  --ag-primary-300: #8FB0D2;
  --ag-primary-400: #5E87B5;
  --ag-primary-500: #3A6A9A;
  --ag-primary-600: #2A5279;
  --ag-primary-700: #1A365D;  /* === MAIN BRAND COLOR === */
  --ag-primary-800: #152B4A;
  --ag-primary-900: #102136;

  /* --- Neutral Scale (blue-grey) --- */
  --ag-neutral-50: #F8FAFC;
  --ag-neutral-100: #F1F5F9;
  --ag-neutral-200: #E2E8F0;
  --ag-neutral-300: #CBD5E1;
  --ag-neutral-400: #94A3B8;
  --ag-neutral-500: #64748B;
  --ag-neutral-600: #475569;
  --ag-neutral-700: #334155;
  --ag-neutral-800: #1E293B;
  --ag-neutral-900: #0F172A;

  /* --- State Colors (semantic status only) --- */
  --state-success: #2E7D32;
  --state-success-light: #E8F5E9;
  --state-success-dark: #1B5E20;
  --state-warning: #F57C00;
  --state-warning-light: #FFF3E0;
  --state-warning-dark: #E65100;
  --state-error: #E53935;
  --state-error-light: #FFEBEE;
  --state-error-dark: #C62828;
  --state-info: #1976D2;
  --state-info-light: #E3F2FD;

  /* --- Force Takedown (special dark-red) --- */
  --state-forced-takedown: #8B0000;
  --state-forced-takedown-light: #FCE4EC;

  /* --- Semantic Aliases (light mode) --- */
  --ag-background: #FFFFFF;
  --ag-foreground: #1E293B;
  --ag-card: #FFFFFF;
  --ag-card-foreground: #1E293B;
  --ag-popover: #FFFFFF;
  --ag-popover-foreground: #1E293B;
  --ag-primary: #1A365D;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #F1F5F9;
  --ag-muted-foreground: #64748B;
  --ag-border: #E2E8F0;
  --ag-input: #E2E8F0;
  --ag-ring: #1A365D;

  /* --- Radius --- */
  --ag-radius-small: 4px;
  --ag-radius-medium: 8px;
  --ag-radius-large: 12px;
  --ag-radius-full: 9999px;

  /* --- Typography --- */
  --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ag-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* --- Font Sizes --- */
  --ag-text-xs: 12px;
  --ag-text-sm: 13px;
  --ag-text-base: 14px;
  --ag-text-md: 15px;
  --ag-text-lg: 16px;
  --ag-text-xl: 18px;
  --ag-text-2xl: 20px;
  --ag-text-3xl: 24px;
  --ag-text-4xl: 28px;
  --ag-text-5xl: 32px;

  /* --- Shadows (floating layers only: modal, popover, dropdown) --- */
  --ag-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --ag-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --ag-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --ag-shadow-modal: 0 12px 40px rgba(0,0,0,0.16);
}

/* --- Dark Mode (optional, for admin dark panels) --- */
.dark {
  --ag-background: #0F172A;
  --ag-foreground: #E2E8F0;
  --ag-card: #1E293B;
  --ag-card-foreground: #E2E8F0;
  --ag-popover: #1E293B;
  --ag-popover-foreground: #E2E8F0;
  --ag-primary: #5E87B5;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #334155;
  --ag-muted-foreground: #94A3B8;
  --ag-border: #334155;
  --ag-input: #334155;
  --ag-ring: #5E87B5;
}

/* --- Base Typography --- */
body {
  font-family: var(--ag-font-sans);
  font-size: var(--ag-text-base);
  color: var(--ag-foreground);
  background: var(--ag-background);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Status Tag Utility Classes --- */
.tag-pending {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-warning-light);
  color: var(--state-warning-dark);
  white-space: nowrap;
}

.tag-approved {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-success-light);
  color: var(--state-success-dark);
  white-space: nowrap;
}

.tag-rejected {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-error-light);
  color: var(--state-error-dark);
  white-space: nowrap;
}

.tag-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-600);
  white-space: nowrap;
}

.tag-forced-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-forced-takedown-light);
  color: var(--state-forced-takedown);
  white-space: nowrap;
}

/* --- Button Utilities --- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-primary);
  color: var(--ag-primary-foreground);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: var(--ag-primary-600);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: #FFFFFF;
  color: var(--ag-primary);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover {
  background: var(--ag-primary-50);
}

.btn-disabled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-400);
  border: 1px solid var(--ag-neutral-200);
  cursor: not-allowed;
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: var(--state-error-dark);
}

    </style>

<style id="critical-layout">
  .mobile-frame {
    max-width: 414px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--ag-background);
    position: relative;
  }
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: #FFFFFF;
    border-bottom: 1px solid #E2E8F0;
  }
  [data-mobile-nav="global"] {
    position: sticky;
    bottom: 0;
    z-index: 30;
  }
  .card {
    background: #FFFFFF;
    border: 1px solid var(--ag-border);
    border-radius: var(--ag-radius-medium);
  }
  .menu-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    min-height: 56px;
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .menu-row:active {
    background: var(--ag-neutral-50);
  }
  .icon-circle {
    width: 36px;
    height: 36px;
    border-radius: 9999px;
    background: var(--ag-primary-50);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ag-primary-700);
    flex-shrink: 0;
  }
  .icon-circle-danger {
    width: 36px;
    height: 36px;
    border-radius: 9999px;
    background: var(--state-error-light);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--state-error);
    flex-shrink: 0;
  }
  .bottom-sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 40;
  }
  .bottom-sheet {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 414px;
    background: #FFFFFF;
    border-radius: var(--ag-radius-large) var(--ag-radius-large) 0 0;
    z-index: 41;
    padding: 20px 16px;
    box-shadow: var(--ag-shadow-modal);
    max-height: 80vh;
    overflow-y: auto;
  }
  .sheet-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--ag-input);
    border-radius: var(--ag-radius-medium);
    font-size: 14px;
    color: var(--ag-foreground);
    background: #FFFFFF;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  .sheet-input:focus {
    border-color: var(--ag-primary);
  }
  .switch {
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 9999px;
    background: var(--ag-neutral-200);
    transition: background 0.2s;
    flex-shrink: 0;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .switch[aria-checked="true"] {
    background: var(--ag-primary);
  }
  .switch .switch-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 20px;
    height: 20px;
    border-radius: 9999px;
    background: #FFFFFF;
    transition: transform 0.2s;
    box-shadow: var(--ag-shadow-sm);
  }
  .switch[aria-checked="true"] .switch-knob {
    transform: translateX(20px);
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  @media (prefers-reduced-motion: reduce) {
    .animate-spin { animation: none !important; }
  }
</style>

<script>
(function(){
  var SHEETS = ['sheet-payment', 'sheet-settlement', 'sheet-password', 'sheet-notifications'];

  function openSheet(id) {
    var el = document.getElementById(id);
    if (el) { el.classList.remove('hidden'); }
  }
  function closeSheet(id) {
    var el = document.getElementById(id);
    if (el) { el.classList.add('hidden'); }
  }
  function closeAllSheets() {
    for (var i = 0; i < SHEETS.length; i++) { closeSheet(SHEETS[i]); }
  }

  function bind(id, fn) {
    var el = document.getElementById(id);
    if (el) { el.addEventListener('click', fn); }
  }

  // 菜单：主页装修
  bind('menu-profile-edit', function() { alert('请前往 PC 端或工作台完善主页'); });

  // 菜单：打开弹窗
  bind('menu-payment', function() { openSheet('sheet-payment'); });
  bind('menu-settlement', function() { openSheet('sheet-settlement'); });
  bind('menu-password', function() { openSheet('sheet-password'); });
  bind('menu-notifications', function() { openSheet('sheet-notifications'); });

  // 菜单：关于平台
  bind('menu-about', function() { alert('ArtGallery v1.0 演示原型'); });

  // 菜单：退出登录
  bind('menu-logout', function() {
    if (confirm('确认退出当前账号？')) { alert('已退出（演示）'); }
  });

  // 顶部设置按钮
  bind('btn-settings', function() { alert('设置（演示）'); });

  // 遮罩 / 关闭按钮关闭弹窗
  var closers = document.querySelectorAll('[data-close-sheet]');
  for (var i = 0; i < closers.length; i++) {
    (function(closer) {
      closer.addEventListener('click', function() { closeSheet(closer.getAttribute('data-close-sheet')); });
    })(closers[i]);
  }

  // Esc 关闭所有弹窗
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeAllSheets(); }
  });

  // 收款账户：编辑按钮
  bind('btn-edit-payment', function() { alert('编辑收款账户（演示）'); });

  // 修改密码：确认按钮（校验非空）
  bind('btn-password-confirm', function() {
    var oldP = document.getElementById('pwd-old').value.trim();
    var newP = document.getElementById('pwd-new').value.trim();
    var cfmP = document.getElementById('pwd-confirm').value.trim();
    if (!oldP || !newP || !cfmP) {
      alert('请填写完整的密码信息');
      return;
    }
    document.getElementById('pwd-old').value = '';
    document.getElementById('pwd-new').value = '';
    document.getElementById('pwd-confirm').value = '';
    closeSheet('sheet-password');
    alert('密码修改成功');
  });

  // 通知设置：开关切换
  var switches = document.querySelectorAll('.switch');
  for (var j = 0; j < switches.length; j++) {
    (function(sw) {
      sw.addEventListener('click', function() {
        var on = sw.getAttribute('aria-checked') === 'true';
        sw.setAttribute('aria-checked', on ? 'false' : 'true');
      });
    })(switches[j]);
  }
})();
</script>
