/* ==========================================================================
   ArtGallery Brand CSS — Deep Blue-Grey Art Platform
   Primary: #1A365D | States: Success #2E7D32, Warning #F57C00, Error #E53935
   ========================================================================== */

:root {
  /* --- Brand Primary Scale (#1A365D base) --- */
  --ag-primary-50: #F0F5FA;
  --ag-primary-100: #DCE7F2;
  --ag-primary-200: #B8CFE5;
  --ag-primary-300: #8FB0D2;
  --ag-primary-400: #5E87B5;
  --ag-primary-500: #3A6A9A;
  --ag-primary-600: #2A5279;
  --ag-primary-700: #1A365D;  /* === MAIN BRAND COLOR === */
  --ag-primary-800: #152B4A;
  --ag-primary-900: #102136;

  /* --- Neutral Scale (blue-grey) --- */
  --ag-neutral-50: #F8FAFC;
  --ag-neutral-100: #F1F5F9;
  --ag-neutral-200: #E2E8F0;
  --ag-neutral-300: #CBD5E1;
  --ag-neutral-400: #94A3B8;
  --ag-neutral-500: #64748B;
  --ag-neutral-600: #475569;
  --ag-neutral-700: #334155;
  --ag-neutral-800: #1E293B;
  --ag-neutral-900: #0F172A;

  /* --- State Colors (semantic status only) --- */
  --state-success: #2E7D32;
  --state-success-light: #E8F5E9;
  --state-success-dark: #1B5E20;
  --state-warning: #F57C00;
  --state-warning-light: #FFF3E0;
  --state-warning-dark: #E65100;
  --state-error: #E53935;
  --state-error-light: #FFEBEE;
  --state-error-dark: #C62828;
  --state-info: #1976D2;
  --state-info-light: #E3F2FD;

  /* --- Force Takedown (special dark-red) --- */
  --state-forced-takedown: #8B0000;
  --state-forced-takedown-light: #FCE4EC;

  /* --- Semantic Aliases (light mode) --- */
  --ag-background: #FFFFFF;
  --ag-foreground: #1E293B;
  --ag-card: #FFFFFF;
  --ag-card-foreground: #1E293B;
  --ag-popover: #FFFFFF;
  --ag-popover-foreground: #1E293B;
  --ag-primary: #1A365D;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #F1F5F9;
  --ag-muted-foreground: #64748B;
  --ag-border: #E2E8F0;
  --ag-input: #E2E8F0;
  --ag-ring: #1A365D;

  /* --- Radius --- */
  --ag-radius-small: 4px;
  --ag-radius-medium: 8px;
  --ag-radius-large: 12px;
  --ag-radius-full: 9999px;

  /* --- Typography --- */
  --ag-font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ag-font-mono: "SF Mono", "Fira Code", "JetBrains Mono", Consolas, monospace;

  /* --- Font Sizes --- */
  --ag-text-xs: 12px;
  --ag-text-sm: 13px;
  --ag-text-base: 14px;
  --ag-text-md: 15px;
  --ag-text-lg: 16px;
  --ag-text-xl: 18px;
  --ag-text-2xl: 20px;
  --ag-text-3xl: 24px;
  --ag-text-4xl: 28px;
  --ag-text-5xl: 32px;

  /* --- Shadows (floating layers only: modal, popover, dropdown) --- */
  --ag-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --ag-shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --ag-shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  --ag-shadow-modal: 0 12px 40px rgba(0,0,0,0.16);
}

/* --- Dark Mode (optional, for admin dark panels) --- */
.dark {
  --ag-background: #0F172A;
  --ag-foreground: #E2E8F0;
  --ag-card: #1E293B;
  --ag-card-foreground: #E2E8F0;
  --ag-popover: #1E293B;
  --ag-popover-foreground: #E2E8F0;
  --ag-primary: #5E87B5;
  --ag-primary-foreground: #FFFFFF;
  --ag-muted: #334155;
  --ag-muted-foreground: #94A3B8;
  --ag-border: #334155;
  --ag-input: #334155;
  --ag-ring: #5E87B5;
}

/* --- Base Typography --- */
body {
  font-family: var(--ag-font-sans);
  font-size: var(--ag-text-base);
  color: var(--ag-foreground);
  background: var(--ag-background);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* --- Status Tag Utility Classes --- */
.tag-pending {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-warning-light);
  color: var(--state-warning-dark);
  white-space: nowrap;
}

.tag-approved {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-success-light);
  color: var(--state-success-dark);
  white-space: nowrap;
}

.tag-rejected {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-error-light);
  color: var(--state-error-dark);
  white-space: nowrap;
}

.tag-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-600);
  white-space: nowrap;
}

.tag-forced-offline {
  display: inline-flex;
  align-items: center;
  padding: 2px 10px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-xs);
  font-weight: 500;
  background: var(--state-forced-takedown-light);
  color: var(--state-forced-takedown);
  white-space: nowrap;
}

/* --- Button Utilities --- */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-primary);
  color: var(--ag-primary-foreground);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover {
  background: var(--ag-primary-600);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: #FFFFFF;
  color: var(--ag-primary);
  border: 1px solid var(--ag-primary);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-secondary:hover {
  background: var(--ag-primary-50);
}

.btn-disabled {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--ag-neutral-100);
  color: var(--ag-neutral-400);
  border: 1px solid var(--ag-neutral-200);
  cursor: not-allowed;
}

.btn-danger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 20px;
  border-radius: var(--ag-radius-small);
  font-size: var(--ag-text-base);
  font-weight: 500;
  background: var(--state-error);
  color: #FFFFFF;
  border: 1px solid var(--state-error);
  cursor: pointer;
  transition: background 0.15s;
}
.btn-danger:hover {
  background: var(--state-error-dark);
}

  <script>
    (function() {
      const tabs = document.querySelectorAll('.tab');
      const panels = document.querySelectorAll('.tab-panel');
      tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
          const target = tab.getAttribute('data-target');
          tabs.forEach(function(t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
          panels.forEach(function(p) { p.classList.remove('active'); });
          tab.classList.add('active'); tab.setAttribute('aria-selected', 'true');
          document.getElementById(target).classList.add('active');
        });
      });

      // ===== 审核操作：查看详情 / 通过 / 驳回 / 强制下架 =====
      var agCss = document.createElement('style');
      agCss.textContent =
        '.ag-overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--ag-neutral-900) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:24px;z-index:1000;}' +
        '.ag-modal{width:100%;max-width:340px;background:var(--ag-card);border:1px solid var(--ag-border);border-radius:var(--ag-radius-large);box-shadow:var(--ag-shadow-modal);overflow:hidden;}' +
        '.ag-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:var(--ag-text-lg);font-weight:600;color:var(--ag-foreground);border-bottom:1px solid var(--ag-border);}' +
        '.ag-modal-close{border:none;background:transparent;font-size:20px;line-height:1;color:var(--ag-neutral-400);cursor:pointer;padding:4px 8px;}' +
        '.ag-modal-body{padding:16px;font-size:var(--ag-text-sm);color:var(--ag-neutral-600);}' +
        '.ag-modal-foot{display:flex;gap:10px;padding:0 16px 16px;}' +
        '.ag-modal-foot .btn-primary,.ag-modal-foot .btn-secondary{flex:1;min-height:40px;padding:0 12px;font-size:var(--ag-text-sm);}' +
        '.ag-reason{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--ag-border);border-radius:var(--ag-radius-medium);margin-bottom:8px;cursor:pointer;font-size:var(--ag-text-base);color:var(--ag-foreground);background:var(--ag-card);}' +
        '.ag-reason.sel{border-color:var(--ag-primary);background:var(--ag-primary-50);color:var(--ag-primary);}';
      document.head.appendChild(agCss);

      function openModal(title, bodyHtml) {
        var overlay = document.createElement('div');
        overlay.className = 'ag-overlay';
        overlay.innerHTML =
          '<div class="ag-modal" role="dialog" aria-modal="true">' +
            '<div class="ag-modal-head">' + title + '<button type="button" class="ag-modal-close" aria-label="关闭">&times;</button></div>' +
            '<div class="ag-modal-body">' + bodyHtml + '</div>' +
          '</div>';
        overlay.querySelector('.ag-modal-close').addEventListener('click', closeModal);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });
        document.body.appendChild(overlay);
        return overlay;
      }
      function closeModal() {
        var o = document.querySelector('.ag-overlay');
        if (o) o.remove();
      }

      function setReviewTag(card, cls, text) {
        var tag = card.querySelector('.review-row span[class*="tag-"]');
        if (tag) { tag.className = cls; tag.textContent = text; }
      }
      function lockReviewActions(card) {
        card.querySelectorAll('.review-actions button').forEach(function(b) {
          b.disabled = true; b.style.opacity = '0.5'; b.style.cursor = 'not-allowed';
        });
      }

      // 查看详情 → 详情弹窗
      document.querySelectorAll('[id^="detail-"]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var card = btn.closest('.review-card');
          var name = card.querySelector('.review-name').textContent.trim();
          var meta = card.querySelector('.review-meta').textContent.trim();
          openModal('审核详情',
            '<div style="font-weight:600;font-size:var(--ag-text-base);color:var(--ag-foreground);margin-bottom:6px;">' + name + '</div>' +
            '<div>' + meta + '</div>' +
            '<div style="margin-top:10px;">资质与作品材料已提交，可在正式后台查看完整档案与沟通记录。</div>');
        });
      });

      // 通过
      document.querySelectorAll('[id^="approve-"]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var card = btn.closest('.review-card');
          if (card.querySelector('.review-row span.tag-approved, .review-row span.tag-rejected')) return;
          alert('已通过');
          setReviewTag(card, 'tag-approved', '已通过');
          lockReviewActions(card);
        });
      });

      // 驳回 → 原因弹窗
      function openRejectModal(card, name) {
        var reasons = ['内容不符合平台规范', '涉嫌侵权或仿冒', '作品信息不完整', '图片质量不合格', '其他原因'];
        var html = '<div style="font-weight:600;font-size:var(--ag-text-base);color:var(--ag-foreground);margin-bottom:10px;">请选择驳回原因（' + name + '）</div>';
        reasons.forEach(function(r) { html += '<div class="ag-reason">' + r + '</div>'; });
        var overlay = openModal('驳回审核', html);
        overlay.querySelectorAll('.ag-reason').forEach(function(el) {
          el.addEventListener('click', function() {
            overlay.querySelectorAll('.ag-reason').forEach(function(x) { x.classList.remove('sel'); });
            el.classList.add('sel');
          });
        });
        var foot = document.createElement('div');
        foot.className = 'ag-modal-foot';
        foot.innerHTML = '<button type="button" class="btn-secondary">取消</button><button type="button" class="btn-primary">确认驳回</button>';
        overlay.querySelector('.ag-modal').appendChild(foot);
        foot.querySelector('.btn-secondary').addEventListener('click', closeModal);
        foot.querySelector('.btn-primary').addEventListener('click', function() {
          var sel = overlay.querySelector('.ag-reason.sel');
          var reason = sel ? sel.textContent.trim() : '未选择原因';
          closeModal();
          alert('已驳回：' + reason);
          setReviewTag(card, 'tag-rejected', '已驳回');
          lockReviewActions(card);
        });
      }
      document.querySelectorAll('[id^="reject-"]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var card = btn.closest('.review-card');
          if (card.querySelector('.review-row span.tag-approved, .review-row span.tag-rejected')) return;
          openRejectModal(card, card.querySelector('.review-name').textContent.trim());
        });
      });

      // 强制下架 → 确认后提示
      document.querySelectorAll('[id^="force-"]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var card = btn.closest('.review-card');
          if (window.confirm('确认强制下架该作品？此操作不可撤销。')) {
            alert('已强制下架');
            setReviewTag(card, 'tag-forced-offline', '平台强制下架');
            lockReviewActions(card);
          }
        });
      });

      // 底部导航「我的」（模拟）
      var navProfile = document.getElementById('nav-profile');
      if (navProfile) {
        navProfile.addEventListener('click', function(e) { e.preventDefault(); alert('个人中心即将上线'); });
      }
    })();
  </script>

      display: flex; background: #FFFFFF; border-bottom: 1px solid var(--ag-border);
