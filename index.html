<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtGallery 跨境美术交易平台 - 原型演示</title>
  <style>
    :root {
      --primary: #1A365D;
      --primary-100: #DCE7F2;
      --neutral-50: #F8FAFC;
      --neutral-200: #E2E8F0;
      --neutral-500: #64748B;
      --neutral-800: #1E293B;
      --success: #2E7D32;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--neutral-50); color: var(--neutral-800); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { max-width: 720px; width: 100%; padding: 40px 24px; }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-mark { width: 44px; height: 44px; border-radius: 10px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
    h1 { font-size: 26px; font-weight: 700; color: var(--primary); letter-spacing: 0.01em; }
    .sub { color: var(--neutral-500); font-size: 14px; margin-top: 4px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 12px; }
    .card { background: #fff; border: 1px solid var(--neutral-200); border-radius: 12px; padding: 24px; text-decoration: none; color: inherit; transition: box-shadow 0.15s, transform 0.15s; display: block; }
    .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.10); transform: translateY(-2px); }
    .card-title { font-size: 17px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    .card-desc { font-size: 13px; color: var(--neutral-500); margin-top: 8px; line-height: 1.7; }
    .badge { display: inline-block; margin-top: 14px; padding: 4px 12px; border-radius: 9999px; background: var(--primary-100); color: var(--primary); font-size: 12px; font-weight: 600; }
    .tip { margin-top: 28px; font-size: 12px; color: var(--neutral-500); line-height: 1.8; text-align: center; }
    @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-mark">艺</div>
      <div>
        <h1>ArtGallery 跨境美术交易平台</h1>
        <div class="sub">交互原型演示 · PC 端 + 移动端</div>
      </div>
    </div>
    <div class="cards">
      <a class="card" href="artgallery-desktop/pages/admin-login.html">
        <div class="card-title">PC 端原型</div>
        <div class="card-desc">买家官网、艺术家工作台、平台管理后台三端完整流程，建议在电脑浏览器全屏演示。</div>
        <span class="badge">进入 PC 端演示 →</span>
      </a>
      <a class="card" href="artgallery-mobile/pages/app-home.html">
        <div class="card-title">移动端原型</div>
        <div class="card-desc">手机端 H5 原型，建议使用浏览器开发者工具切换为手机视口，或直接手机访问。</div>
        <span class="badge">进入移动端演示 →</span>
      </a>
    </div>
    <div class="tip">三端入口：平台后台（admin-login）、艺术家工作台（artist-onboarding）、买家官网（buyer-home）。</div>
  </div>
</body>
</html>
